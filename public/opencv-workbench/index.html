<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101b22" />
  <meta name="description" content="Research and validation workspace for OpenCV surface image placement." />
  <title>OpenCV Surface Placement Workbench</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">CV</span><div><b>FIELD / FRAME</b><small>OpenCV research lab</small></div></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom"><span class="local-dot"></span><span>Local workspace</span><span class="pill small">PRIVATE</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuToggle" aria-label="Open navigation">☰</button>
        <div class="crumb"><span>RESEARCH SYSTEMS</span><span class="slash">/</span><b id="currentCrumb">OVERVIEW</b></div>
        <div class="top-actions"><span class="save-state"><i></i><span id="saveState">Saved locally</span></span><button class="button button-primary" id="quickAdd">＋ Add record</button></div>
      </header>
      <div class="content" id="content"></div>
      <footer>FLEX‑VISION · OPENCV SURFACE PLACEMENT <span>Research and measured results stay separate.</span></footer>
    </main>
  </div>
  <dialog id="recordDialog" class="record-dialog"><form id="recordForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">WORKSPACE RECORD</span><h2 id="dialogTitle">Add record</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Close">×</button></div><div id="formFields" class="form-grid"></div><div class="dialog-actions"><button type="button" class="button button-quiet" id="cancelDialog">Cancel</button><button class="button button-primary" value="save">Save record</button></div></form></dialog>
  <dialog id="detailDialog" class="record-dialog detail-dialog"><div id="detailContent"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
